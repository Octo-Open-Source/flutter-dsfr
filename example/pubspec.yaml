name: example
description: "Example"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dsfr:
    path: ../
  accessibility_tools: ^3.0.0
  device_preview: ^1.3.1 # 3.x removes the in-app toolbar used by the web demo
  url_launcher: ^6.3.3
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
  uses-material-design: true