include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

linter:
  rules:
    always_declare_return_types: true
    always_use_package_imports: true

analyzer:
  exclude:
    - build/**
  plugins:
    - custom_lint
  errors:
    # custom_lint (used by dsfr_lints) still relies on the legacy analyzer plugin system
    analysis_options_deprecated_plugins: ignore

custom_lint:
  rules:
    - prefer_using_color_decision: true